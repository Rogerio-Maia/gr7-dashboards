<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top 10 Produtos — 03/03/2026 — GR7 Sistemas</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0f1117;color:#e6edf3;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;padding:20px;min-height:100vh}
  header{text-align:center;margin-bottom:28px}
  .logo{display:inline-block;background:linear-gradient(135deg,#58a6ff,#3fb950);color:#0f1117;font-weight:900;font-size:22px;padding:8px 18px;border-radius:10px;letter-spacing:2px;margin-bottom:8px}
  header h1{font-size:22px;font-weight:600;color:#e6edf3;margin-bottom:4px}
  header .sub{font-size:14px;color:#8b949e}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
  .kpi{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:18px;text-align:center}
  .kpi .label{font-size:12px;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
  .kpi .value{font-size:26px;font-weight:700}
  .kpi.blue .value{color:#58a6ff}
  .kpi.green .value{color:#3fb950}
  .kpi.gold .value{color:#d29922}
  .kpi.purple .value{color:#bc8cff}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px}
  .card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:20px}
  .card h2{font-size:16px;font-weight:600;margin-bottom:16px;color:#e6edf3}
  .bar-row{display:flex;align-items:center;margin-bottom:10px;gap:10px}
  .bar-rank{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
  .bar-rank.r1{background:#d29922;color:#0f1117}
  .bar-rank.r2{background:#8b949e;color:#0f1117}
  .bar-rank.r3{background:#a0522d;color:#fff}
  .bar-rank.rn{background:#30363d;color:#8b949e}
  .bar-name{width:160px;font-size:12px;color:#c9d1d9;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar-track{flex:1;height:26px;background:#21262d;border-radius:6px;overflow:hidden;position:relative}
  .bar-fill{height:100%;border-radius:6px;transition:width 1s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:11px;font-weight:600;color:#fff;min-width:0;width:0}
  .bar-val{width:90px;font-size:12px;color:#8b949e;text-align:right;flex-shrink:0}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:1px;padding:8px 10px;border-bottom:1px solid #30363d}
  td{padding:10px;border-bottom:1px solid #21262d;font-size:13px;color:#c9d1d9}
  td:first-child{font-weight:600;color:#e6edf3}
  tr:hover td{background:#1c2128}
  .prod-img{width:36px;height:36px;border-radius:6px;object-fit:cover;background:#21262d;vertical-align:middle;margin-right:8px}
  .prod-cell{display:flex;align-items:center}
  footer{text-align:center;color:#484f58;font-size:12px;margin-top:24px;padding-top:16px;border-top:1px solid #21262d}
  @media(max-width:880px){
    .kpis{grid-template-columns:repeat(2,1fr)}
    .grid{grid-template-columns:1fr}
    .bar-name{width:100px}
  }
  @media(max-width:480px){
    .kpis{grid-template-columns:1fr}
    .bar-name{width:80px}
  }
  .colors-0{background:linear-gradient(90deg,#58a6ff,#79bbff)}
  .colors-1{background:linear-gradient(90deg,#3fb950,#56d364)}
  .colors-2{background:linear-gradient(90deg,#d29922,#e3b341)}
  .colors-3{background:linear-gradient(90deg,#bc8cff,#d2a8ff)}
  .colors-4{background:linear-gradient(90deg,#f78166,#ffa28b)}
  .colors-5{background:linear-gradient(90deg,#39d353,#56d364)}
  .colors-6{background:linear-gradient(90deg,#db6d28,#f0883e)}
  .colors-7{background:linear-gradient(90deg,#8957e5,#a371f7)}
  .colors-8{background:linear-gradient(90deg,#f778ba,#ff9bce)}
  .colors-9{background:linear-gradient(90deg,#79c0ff,#a5d6ff)}
</style>
</head>
<body>

<header>
  <div class="logo">GR7</div>
  <h1>Top 10 Produtos Mais Vendidos</h1>
  <div class="sub">03 de Março de 2026 — Segunda-feira</div>
</header>

<div class="kpis">
  <div class="kpi blue">
    <div class="label">Cupons</div>
    <div class="value">720</div>
  </div>
  <div class="kpi green">
    <div class="label">Faturamento</div>
    <div class="value">R$ 77.869,10</div>
  </div>
  <div class="kpi gold">
    <div class="label">Ticket Médio</div>
    <div class="value">R$ 108,15</div>
  </div>
  <div class="kpi purple">
    <div class="label">Itens Top 10</div>
    <div class="value">1.131</div>
  </div>
</div>

<div class="grid">
  <div class="card">
    <h2>Ranking por Quantidade</h2>
    <div id="chart"></div>
  </div>
  <div class="card">
    <h2>Detalhamento</h2>
    <table>
      <thead><tr><th>#</th><th>Produto</th><th>Qtd</th><th>Valor</th></tr></thead>
      <tbody id="tbl"></tbody>
    </table>
  </div>
</div>

<footer>
  Dashboard gerado automaticamente em <span id="gen-date"></span> — GR7 Sistemas &bull; Dados: API GR7 BI
</footer>

<script>
const DATA = [
  {pos:1,  nome:"Verduras Diversas",              cod:37930, barras:"0",             qtd:396.21, valor:368.01},
  {pos:2,  nome:"Sorvete Picolé Bibi da Casa 60g",cod:58265, barras:"58265",         qtd:149,    valor:93.24},
  {pos:3,  nome:"Óleo Soja Select 900ml",         cod:70422, barras:"7898497682761", qtd:92,     valor:629.10},
  {pos:4,  nome:"Banana Nanica",                   cod:14938, barras:"65",            qtd:86.99,  valor:419.10},
  {pos:5,  nome:"Água Minalice 510ml c/Gás",      cod:756,   barras:"7896326100141", qtd:76,     valor:113.24},
  {pos:6,  nome:"Creme de Leite Italac 200g",     cod:84227, barras:"7898080643223", qtd:76,     valor:151.24},
  {pos:7,  nome:"Leite Aurora 1L Semi Desn.",      cod:74237, barras:"7891164028220", qtd:69,     valor:240.81},
  {pos:8,  nome:"Leite Aurora 1L Integral",        cod:82504, barras:"7891164028237", qtd:66,     valor:296.34},
  {pos:9,  nome:"Steak Frango Seara 100g",        cod:27351, barras:"7894904003495", qtd:63,     valor:108.27},
  {pos:10, nome:"Laranja Pera",                    cod:14956, barras:"73",            qtd:57.75,  valor:172.68}
];

const maxQtd = DATA[0].qtd;
const chart = document.getElementById('chart');
const tbl = document.getElementById('tbl');

DATA.forEach((d, i) => {
  const pct = (d.qtd / maxQtd * 100).toFixed(1);
  const rc = i === 0 ? 'r1' : i === 1 ? 'r2' : i === 2 ? 'r3' : 'rn';
  chart.innerHTML += `
    <div class="bar-row">
      <div class="bar-rank ${rc}">${d.pos}</div>
      <div class="bar-name" title="${d.nome}">${d.nome}</div>
      <div class="bar-track">
        <div class="bar-fill colors-${i}" data-w="${pct}%">${d.qtd % 1 === 0 ? d.qtd : d.qtd.toFixed(2)}</div>
      </div>
      <div class="bar-val">R$ ${d.valor.toLocaleString('pt-BR',{minimumFractionDigits:2})}</div>
    </div>`;

  const imgUrl = d.barras.length >= 8
    ? `https://gr7-imagens-mercado.s3.sa-east-1.amazonaws.com/JPG/${d.barras}.jpg`
    : '';
  const imgTag = imgUrl
    ? `<img class="prod-img" src="${imgUrl}" onerror="this.style.display='none'">`
    : '';

  tbl.innerHTML += `
    <tr>
      <td>${d.pos}</td>
      <td><div class="prod-cell">${imgTag}${d.nome}</div></td>
      <td>${d.qtd % 1 === 0 ? d.qtd : d.qtd.toFixed(2)}</td>
      <td>R$ ${d.valor.toLocaleString('pt-BR',{minimumFractionDigits:2})}</td>
    </tr>`;
});

requestAnimationFrame(() => {
  document.querySelectorAll('.bar-fill').forEach((el, i) => {
    setTimeout(() => { el.style.width = el.dataset.w; }, i * 80);
  });
});

document.getElementById('gen-date').textContent = new Date().toLocaleString('pt-BR');
</script>
</body>
</html>
